[package]
name = "forza-sound-modifier"
version = "0.1.0"
edition = "2021"
description = "GUI for editing Forza Horizon 6 sound profiles"

[[bin]]
name = "forza-sound-modifier"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmltree = "0.10"
xml-rs = "0.8"
dirs = "5"
rfd = "0.14"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
opener = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
