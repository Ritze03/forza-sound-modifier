[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forza-sound-modifier"
version = "0.1.0"
description = "GUI for editing Forza Horizon 6 sound profiles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7",
]

[project.scripts]
forza-sound-modifier = "sound_modifier_gui:main"

[tool.setuptools]
py-modules = ["sound_modifier_gui"]